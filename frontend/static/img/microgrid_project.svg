<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="mgBg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="solP2" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#mgBg)"/>

  <!-- Ground -->
  <rect x="0" y="170" width="400" height="70" fill="#10b981" opacity="0.9"/>
  <rect x="0" y="210" width="400" height="30" fill="#059669"/>

  <!-- Power lines linking houses -->
  <path d="M70 120 Q140 100 200 120 Q270 105 330 120" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  
  <!-- House 1 (Left) -->
  <g transform="translate(40, 110)">
    <rect x="0" y="30" width="60" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
    <polygon points="-4,30 30,8 64,30" fill="#334155"/>
    <polygon points="5,28 30,10 30,28" fill="url(#solP2)"/>
    <polygon points="32,10 57,28 32,28" fill="url(#solP2)"/>
    <rect x="24" y="45" width="12" height="25" fill="#0284c7"/>
  </g>

  <!-- Community Battery Hub (Center) -->
  <g transform="translate(165, 120)">
    <rect x="0" y="10" width="70" height="50" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect x="10" y="20" width="50" height="10" rx="2" fill="#10b981" opacity="0.9"/>
    <rect x="10" y="34" width="50" height="10" rx="2" fill="#10b981" opacity="0.9"/>
    <circle cx="50" cy="52" r="3" fill="#38bdf8"/>
    <circle cx="58" cy="52" r="3" fill="#10b981"/>
    <text x="12" y="55" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff">BATTERY</text>
  </g>

  <!-- House 2 (Right) -->
  <g transform="translate(290, 110)">
    <rect x="0" y="30" width="60" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
    <polygon points="-4,30 30,8 64,30" fill="#1e293b"/>
    <polygon points="5,28 30,10 30,28" fill="url(#solP2)"/>
    <polygon points="32,10 57,28 32,28" fill="url(#solP2)"/>
    <rect x="24" y="45" width="12" height="25" fill="#10b981"/>
  </g>

  <!-- Trees -->
  <g transform="translate(120, 145)">
    <rect x="6" y="15" width="4" height="12" fill="#78350f"/>
    <circle cx="8" cy="12" r="10" fill="#059669"/>
  </g>
  <g transform="translate(260, 145)">
    <rect x="6" y="15" width="4" height="12" fill="#78350f"/>
    <circle cx="8" cy="12" r="10" fill="#059669"/>
  </g>

  <!-- Badge -->
  <rect x="16" y="16" width="135" height="28" rx="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="30" cy="30" r="7" fill="#8b5cf6"/>
  <text x="44" y="34" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#0f172a">MICROGRID 225 kW</text>
</svg>
