<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="solarPanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="420" rx="20" fill="url(#skyGrad)"/>

  <!-- Radiant Sun -->
  <circle cx="500" cy="90" r="48" fill="url(#sunGrad)" opacity="0.9"/>
  <circle cx="500" cy="90" r="64" stroke="#fde68a" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Clouds -->
  <path d="M70 90 A20 20 0 0 1 110 90 A25 25 0 0 1 150 90 A15 15 0 0 1 165 95 L65 95 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M260 70 A15 15 0 0 1 290 70 A20 20 0 0 1 325 70 L250 70 Z" fill="#ffffff" opacity="0.7"/>

  <!-- Distant Mountains -->
  <path d="M-20 290 Q80 180 200 280 T420 270 Q510 190 620 290 L620 420 L-20 420 Z" fill="#a7f3d0" opacity="0.5"/>
  <!-- Middle Hills -->
  <path d="M-20 320 Q120 220 280 320 Q440 240 620 330 L620 420 L-20 420 Z" fill="url(#hillGrad1)" opacity="0.85"/>
  <!-- Foreground Hill -->
  <path d="M-20 360 Q180 280 400 360 Q520 320 620 370 L620 420 L-20 420 Z" fill="url(#hillGrad2)"/>

  <!-- Wind Turbines -->
  <!-- Turbine 1 (Distant) -->
  <g transform="translate(140, 150)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="0" cy="0" r="5" fill="#64748b"/>
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="38" y2="24" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-38" y2="24" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Turbine 2 (Mid-distance) -->
  <g transform="translate(230, 110)">
    <line x1="0" y1="0" x2="0" y2="160" stroke="#e2e8f0" stroke-width="5"/>
    <circle cx="0" cy="0" r="6" fill="#64748b"/>
    <line x1="0" y1="0" x2="-35" y2="-42" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="52" y2="-12" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-18" y2="52" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Eco Community Houses with Solar Roofs -->
  <!-- House 1 -->
  <g transform="translate(340, 260)" filter="url(#shadow)">
    <!-- Base -->
    <rect x="0" y="40" width="85" height="60" rx="3" fill="#ffffff"/>
    <rect x="35" y="65" width="16" height="35" fill="#0284c7" rx="2"/>
    <rect x="10" y="55" width="18" height="18" fill="#bae6fd" rx="2"/>
    <rect x="58" y="55" width="18" height="18" fill="#bae6fd" rx="2"/>
    <!-- Roof with Solar Panels -->
    <polygon points="-5,40 42,5 90,40" fill="#334155"/>
    <polygon points="5,38 42,8 42,38" fill="url(#solarPanelGrad)" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="45,8 82,38 45,38" fill="url(#solarPanelGrad)" stroke="#38bdf8" stroke-width="1"/>
    <!-- Grid pattern on solar panels -->
    <line x1="15" y1="38" x2="35" y2="18" stroke="#38bdf8" stroke-width="0.75"/>
    <line x1="28" y1="38" x2="40" y2="28" stroke="#38bdf8" stroke-width="0.75"/>
    <line x1="55" y1="18" x2="75" y2="38" stroke="#38bdf8" stroke-width="0.75"/>
  </g>

  <!-- House 2 -->
  <g transform="translate(450, 280)" filter="url(#shadow)">
    <rect x="0" y="35" width="70" height="55" rx="3" fill="#f8fafc"/>
    <rect x="26" y="55" width="16" height="35" fill="#047857" rx="2"/>
    <rect x="8" y="48" width="14" height="14" fill="#a7f3d0" rx="2"/>
    <polygon points="-4,35 35,6 74,35" fill="#1e293b"/>
    <polygon points="4,33 35,9 66,33" fill="url(#solarPanelGrad)" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Ground Solar Array Field (Left) -->
  <g transform="translate(50, 310)" filter="url(#shadow)">
    <!-- Stand 1 -->
    <line x1="20" y1="40" x2="20" y2="55" stroke="#475569" stroke-width="3"/>
    <line x1="60" y1="40" x2="60" y2="55" stroke="#475569" stroke-width="3"/>
    <!-- Angled Panel 1 -->
    <polygon points="10,40 70,25 75,45 15,60" fill="url(#solarPanelGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="40" y1="33" x2="45" y2="53" stroke="#7dd3fc" stroke-width="1"/>
    <line x1="12" y1="50" x2="72" y2="35" stroke="#7dd3fc" stroke-width="1"/>
    
    <!-- Stand 2 -->
    <line x1="95" y1="50" x2="95" y2="65" stroke="#475569" stroke-width="3"/>
    <line x1="135" y1="50" x2="135" y2="65" stroke="#475569" stroke-width="3"/>
    <!-- Angled Panel 2 -->
    <polygon points="85,50 145,35 150,55 90,70" fill="url(#solarPanelGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="115" y1="43" x2="120" y2="63" stroke="#7dd3fc" stroke-width="1"/>
  </g>

  <!-- Trees -->
  <g transform="translate(290, 315)">
    <rect x="8" y="30" width="6" height="20" fill="#78350f"/>
    <circle cx="11" cy="22" r="16" fill="#10b981"/>
    <circle cx="11" cy="12" r="12" fill="#34d399"/>
  </g>
  <g transform="translate(325, 340)">
    <rect x="6" y="20" width="5" height="15" fill="#78350f"/>
    <circle cx="8" cy="15" r="13" fill="#059669"/>
  </g>
  <g transform="translate(540, 330)">
    <rect x="8" y="25" width="6" height="18" fill="#78350f"/>
    <circle cx="11" cy="18" r="15" fill="#10b981"/>
  </g>

  <!-- Floating Green Energy Badges -->
  <g transform="translate(40, 150)" filter="url(#shadow)">
    <rect width="130" height="38" rx="19" fill="#ffffff" opacity="0.95"/>
    <circle cx="20" cy="19" r="12" fill="#ecfdf5"/>
    <path d="M20 12 L22 17 L27 19 L22 21 L20 26 L18 21 L13 19 L18 17 Z" fill="#10b981"/>
    <text x="38" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#047857">100% CLEAN</text>
  </g>

  <g transform="translate(420, 190)" filter="url(#shadow)">
    <rect width="145" height="38" rx="19" fill="#ffffff" opacity="0.95"/>
    <circle cx="20" cy="19" r="12" fill="#f0fdf4"/>
    <text x="14" y="23" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#059669">CO₂</text>
    <text x="40" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f172a">-5,720 Tons/Yr</text>
  </g>
</svg>
