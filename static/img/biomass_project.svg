<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="bioBg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="tankGrad" x1="0" y1="0" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#bioBg)"/>

  <!-- Field Background -->
  <path d="M0 160 Q120 140 240 160 T400 150 L400 240 L0 240 Z" fill="#86efac" opacity="0.6"/>
  <path d="M0 185 Q160 170 300 190 T400 180 L400 240 L0 240 Z" fill="#15803d"/>

  <!-- Anaerobic Digester Dome Tank -->
  <g transform="translate(140, 110)">
    <path d="M0 80 L0 30 Q60 -20 120 30 L120 80 Z" fill="url(#tankGrad)" stroke="#047857" stroke-width="2"/>
    <!-- Tank details & bands -->
    <ellipse cx="60" cy="30" rx="60" ry="12" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="4 4"/>
    <ellipse cx="60" cy="55" rx="60" ry="10" fill="none" stroke="#047857" stroke-width="1.5"/>
    <!-- Gas vent pipe -->
    <path d="M60 0 L60 -20 L90 -20 L90 20" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="-20" r="3" fill="#cbd5e1"/>
    <!-- Leaf emblem on tank -->
    <circle cx="60" cy="40" r="16" fill="#ffffff" opacity="0.9"/>
    <path d="M54 44 C53 38 60 32 64 34 C65 40 60 45 54 44 Z" fill="#059669"/>
  </g>

  <!-- Processing / Generator Building (Left) -->
  <g transform="translate(40, 140)">
    <rect x="0" y="20" width="65" height="40" fill="#ffffff" stroke="#475569" stroke-width="2" rx="2"/>
    <polygon points="-5,20 32,5 70,20" fill="#d97706"/>
    <rect x="22" y="32" width="20" height="28" fill="#475569"/>
    <rect x="7" y="26" width="10" height="10" fill="#bae6fd"/>
  </g>

  <!-- Organic waste input conveyor -->
  <line x1="105" y1="165" x2="140" y2="145" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>

  <!-- Fertilizer Sacks (Right) -->
  <g transform="translate(290, 160)">
    <ellipse cx="25" cy="30" rx="18" ry="12" fill="#ca8a04"/>
    <ellipse cx="45" cy="32" rx="16" ry="10" fill="#a16207"/>
    <ellipse cx="35" cy="22" rx="14" ry="9" fill="#eab308"/>
    <text x="26" y="24" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">BIO</text>
  </g>

  <!-- Badge -->
  <rect x="16" y="16" width="130" height="28" rx="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="30" cy="30" r="7" fill="#16a34a"/>
  <text x="44" y="34" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#0f172a">BIOMASS 350 kW</text>
</svg>
